<div class="bg-white rounded-2xl overflow-hidden border border-slate-100 hover:border-primary-200 hover:shadow-xl hover:shadow-primary-500/5 transition-all group flex flex-col h-full">
  <!-- Thumbnail -->
  <div class="relative aspect-video overflow-hidden">
    <img [src]="course.thumbnailUrl" [alt]="course.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
    <div class="absolute top-3 right-3 px-2 py-1 rounded-md bg-white/90 backdrop-blur-sm text-xs font-bold text-slate-800 shadow-sm">
      {{course.category}}
    </div>
  </div>

  <!-- Content -->
  <div class="p-5 flex flex-col flex-1">
    <div class="flex items-center gap-1 mb-3">
      <lucide-icon [name]="Star" class="text-amber-400 fill-amber-400" size="14"></lucide-icon>
      <span class="text-sm font-bold text-slate-700">{{course.rating}}</span>
      <span class="text-xs text-slate-400">({{course.reviewCount | number}})</span>
    </div>

    <h3 class="font-bold text-slate-800 mb-2 line-clamp-2 group-hover:text-primary-600 transition-colors">
      <a [routerLink]="['/courses', course.id]">{{course.title}}</a>
    </h3>

    <div class="flex items-center gap-2 mb-4">
      <div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
        <lucide-icon [name]="User" size="12"></lucide-icon>
      </div>
      <span class="text-xs text-slate-500">{{course.instructorName}}</span>
    </div>

    <div class="mt-auto">
      <div class="flex items-center gap-4 text-xs text-slate-400 mb-4">
        <div class="flex items-center gap-1">
          <lucide-icon [name]="Clock" size="14"></lucide-icon>
          {{course.duration}}
        </div>
        <div class="flex items-center gap-1">
          <lucide-icon [name]="BookOpen" size="14"></lucide-icon>
          {{course.lessonCount}} lessons
        </div>
      </div>

      <div class="flex items-center justify-between pt-4 border-t border-slate-50">
        <span class="text-xl font-bold text-slate-900">${{course.price}}</span>
        <span class="px-2 py-1 rounded bg-slate-100 text-[10px] font-bold text-slate-500 uppercase tracking-wider">
          {{course.level}}
        </span>
      </div>
    </div>
  </div>
</div>
